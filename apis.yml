description: smol (smol.com, formerly reachable via smolproducts.com) is a UK-based Certified
  B Corporation direct-to-consumer home cleaning brand founded in 2018 by ex-Unilever product
  leaders. It sells concentrated, eco-conscious laundry capsules, dishwasher tablets, and
  household cleaning products on a letterbox subscription model designed to cut plastic,
  carbon, and chemical waste. smol runs a consumer e-commerce storefront and a Zendesk help
  centre only; enrichment found no public developer API, OpenAPI definition, SDKs, webhooks,
  or agent/MCP surface.
